<!doctype html>
<html lang="ar" dir="rtl" data-skin="visor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Black Fighters — 5 تصاميم كاملة للواجهة (اختار شكلك)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
/* ==================== 5 COMPLETE FRONTEND SKINS ==================== */
:root,
[data-skin="visor"] {
  --bg: #05060a;
  --bg2: #090b11;
  --solid: #0b0d14;
  --surface: rgba(255,255,255,.035);
  --surface2: rgba(255,255,255,.065);
  --line: rgba(255,255,255,.08);
  --line2: rgba(255,255,255,.16);
  --text: #f4f6fb;
  --muted: #8c95a8;
  --faint: #5b6475;
  --acc: #5cf2ff;
  --acc2: #7b8cff;
  --ink: #02161a;
  --accsoft: rgba(92,242,255,.12);
  --glow: rgba(92,242,255,.35);
  --ember: #ffb547;
  --ok: #35e59b;
  --bad: #ff5d6c;
  --vio: #a98bff;
  --font: 'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --display: 'Readex Pro','IBM Plex Sans Arabic',sans-serif;
  --mono: 'JetBrains Mono',ui-monospace,monospace;
  --r: 14px;
  --rl: 24px;
  --btn-r: 999px;
  --ease: cubic-bezier(.22,1,.36,1);
  --side: 276px;
  --card-bg: linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
}

/* SKIN 2: LINEVAULT EMERALD (Tactical Carbon + Emerald #19f08c + Warm Amber) */
[data-skin="linevault"] {
  --bg: #05070a;
  --bg2: #090c11;
  --solid: #0c1017;
  --surface: rgba(14,19,26,.9);
  --surface2: rgba(20,27,36,.95);
  --line: rgba(255,255,255,.08);
  --line2: rgba(25,240,140,.35);
  --text: #f3f6fb;
  --muted: #8a95a7;
  --faint: #556070;
  --acc: #19f08c;
  --acc2: #f59e0b;
  --ink: #03150b;
  --accsoft: rgba(25,240,140,.11);
  --glow: rgba(25,240,140,.28);
  --ember: #f59e0b;
  --ok: #19f08c;
  --bad: #f43f5e;
  --vio: #38bdf8;
  --r: 10px;
  --rl: 16px;
  --btn-r: 12px;
  --card-bg: linear-gradient(180deg,rgba(14,19,26,.95),rgba(9,12,17,.98));
}

/* SKIN 3: ATLAS V5 ROYAL (Deep Archive Navy + Imperial Gold #e5b84b + Warm Ivory) */
[data-skin="atlas"] {
  --bg: #080b12;
  --bg2: #0d121d;
  --solid: #111827;
  --surface: rgba(229,184,75,.04);
  --surface2: rgba(229,184,75,.09);
  --line: rgba(229,184,75,.16);
  --line2: rgba(229,184,75,.38);
  --text: #f9f6ee;
  --muted: #b5ae9e;
  --faint: #787162;
  --acc: #e5b84b;
  --acc2: #f59e0b;
  --ink: #1a1202;
  --accsoft: rgba(229,184,75,.13);
  --glow: rgba(229,184,75,.3);
  --ember: #f59e0b;
  --ok: #34d399;
  --bad: #f87171;
  --vio: #c084fc;
  --display: 'Amiri','Readex Pro','IBM Plex Sans Arabic',serif;
  --r: 8px;
  --rl: 14px;
  --btn-r: 10px;
  --card-bg: linear-gradient(180deg,rgba(22,28,42,.92),rgba(12,16,26,.96));
}

/* SKIN 4: LINEAR ULTRA-MINIMAL (Pure OLED Black #000 + Crisp White + Indigo) */
[data-skin="linear"] {
  --bg: #000000;
  --bg2: #060608;
  --solid: #0a0a0d;
  --surface: rgba(255,255,255,.03);
  --surface2: rgba(255,255,255,.06);
  --line: rgba(255,255,255,.09);
  --line2: rgba(255,255,255,.22);
  --text: #ffffff;
  --muted: #8a8f98;
  --faint: #52565e;
  --acc: #f4f6fb;
  --acc2: #818cf8;
  --ink: #050507;
  --accsoft: rgba(255,255,255,.1);
  --glow: rgba(129,140,248,.25);
  --ember: #fbbf24;
  --ok: #10b981;
  --bad: #ef4444;
  --vio: #818cf8;
  --r: 10px;
  --rl: 16px;
  --btn-r: 10px;
  --card-bg: #08080b;
}

/* SKIN 5: CYBER ARENA CRIMSON (Combat Black + Fighter Crimson #ff2e54 + Violet) */
[data-skin="crimson"] {
  --bg: #070408;
  --bg2: #0e0711;
  --solid: #130917;
  --surface: rgba(255,46,84,.045);
  --surface2: rgba(255,46,84,.09);
  --line: rgba(255,46,84,.16);
  --line2: rgba(255,46,84,.4);
  --text: #fdf2f5;
  --muted: #ad959e;
  --faint: #6e555f;
  --acc: #ff2e54;
  --acc2: #ff7a45;
  --ink: #ffffff;
  --accsoft: rgba(255,46,84,.15);
  --glow: rgba(255,46,84,.42);
  --ember: #ff9f1c;
  --ok: #2ec4b6;
  --bad: #ff2e54;
  --vio: #b5179e;
  --r: 12px;
  --rl: 20px;
  --btn-r: 12px;
  --card-bg: linear-gradient(165deg,rgba(255,46,84,.07),rgba(12,6,16,.95));
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.75;font-size:15.5px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-top:52px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.25;letter-spacing:-.01em}
h1{font-size:clamp(34px,5.6vw,74px);line-height:1.12}
h2{font-size:clamp(26px,3.8vw,46px)}
h3{font-size:20px}
h4{font-size:16px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--acc);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1a1f2b;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:26px;height:26px}
svg.i.xl{width:34px;height:34px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}.faint{color:var(--faint)}.center{text-align:center}.acc{color:var(--acc)}.ember{color:var(--ember)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.grad{background:linear-gradient(100deg,#fff 5%,var(--acc) 55%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mt1{margin-top:8px}.mt2{margin-top:16px}.mt3{margin-top:28px}.mt4{margin-top:48px}.mb2{margin-bottom:16px}.mb3{margin-bottom:28px}
.container{width:min(1200px,calc(100% - 40px));margin-inline:auto}
.hide{display:none!important}

/* ---------- 5-SKIN SWITCHER TOP BAR ---------- */
#skinbar{position:fixed;top:0;inset-inline:0;height:52px;z-index:9999;background:rgba(5,6,10,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px;overflow-x:auto;scrollbar-width:none}
#skinbar .sk-list{display:flex;align-items:center;gap:6px}
#skinbar .sk-btn{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.2s}
#skinbar .sk-btn:hover{color:var(--text);border-color:var(--line2)}
#skinbar .sk-btn.on{background:var(--acc);color:var(--ink);border-color:transparent;box-shadow:0 0 20px -4px var(--glow)}
#skinbar .sk-dot{width:8px;height:8px;border-radius:50%}

/* ---------- ambience ---------- */
.orbs{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.14}
.orb.a{width:560px;height:560px;background:var(--acc);top:-220px;right:-120px}
.orb.b{width:480px;height:480px;background:var(--acc2);top:38%;left:-200px;opacity:.1}
[data-skin="linear"] .orbs,[data-skin="linevault"] .orbs{opacity:.35}

/* ---------- primitives ---------- */
.btn{--h:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:var(--h);padding:0 22px;border-radius:var(--btn-r);border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14.5px;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:var(--acc);color:var(--ink);border-color:transparent;box-shadow:0 10px 28px -10px var(--glow)}
.btn.pri:hover{filter:brightness(1.08);box-shadow:0 14px 34px -8px var(--glow)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surface)}
.btn.emb{background:var(--ember);color:#231400;border-color:transparent;font-weight:700}
.btn.dng{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.35);color:#ff8a95}
.btn.sm{--h:34px;padding:0 14px;font-size:13px}
.btn.lg{--h:52px;padding:0 30px;font-size:16px}
.btn.blk{width:100%}.btn.ic{width:var(--h);padding:0}

.card{position:relative;background:var(--card-bg);border:1px solid var(--line);border-radius:var(--rl);padding:24px;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}
.card.hv:hover{border-color:var(--line2);transform:translateY(-3px)}
.card.glow{border-color:var(--line2);box-shadow:0 24px 60px -30px var(--glow)}
.card.tight{padding:16px;border-radius:var(--r)}

.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--btn-r);border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}

.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:rgba(53,229,155,.14);color:var(--ok)}
.badge.warn{background:rgba(255,181,71,.14);color:var(--ember)}
.badge.bad{background:rgba(255,93,108,.14);color:var(--bad)}
.badge.acc{background:var(--accsoft);color:var(--acc)}
.badge.vio{background:rgba(169,139,255,.15);color:var(--vio)}
.kbd{font-family:var(--mono);font-size:11px;padding:2px 7px;border:1px solid var(--line2);border-radius:6px;color:var(--muted);background:var(--surface)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.06em;color:var(--acc);font-weight:600}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);flex:none;font-size:15px}
.avatar.sm{width:32px;height:32px;font-size:13px}.avatar.xl{width:88px;height:88px;font-size:32px}
.ibox{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accsoft);color:var(--acc);border:1px solid var(--line2);flex:none}
.ibox.ember{background:rgba(255,181,71,.12);color:var(--ember);border-color:rgba(255,181,71,.28)}
.ibox.vio{background:rgba(169,139,255,.12);color:var(--vio);border-color:rgba(169,139,255,.28)}
.ibox.ok{background:rgba(53,229,155,.12);color:var(--ok);border-color:rgba(53,229,155,.28)}
.ibox.bad{background:rgba(255,93,108,.12);color:var(--bad);border-color:rgba(255,93,108,.28)}

.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,.select,.textarea{width:100%;height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);outline:none;transition:.2s}
.textarea{height:auto;padding:14px 16px;min-height:110px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
.iw{position:relative}.iw .i{position:absolute;top:14px;inset-inline-start:14px;color:var(--faint)}.iw .input{padding-inline-start:44px}
.tg{width:44px;height:26px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);position:relative;transition:.25s;flex:none;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}
.tg.on{background:var(--acc);border-color:var(--acc)}.tg.on::after{inset-inline-start:21px;background:var(--ink)}
.sep{display:flex;align-items:center;gap:14px;color:var(--faint);font-size:12.5px;margin:20px 0}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:var(--btn-r);background:var(--surface);border:1px solid var(--line);max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:var(--btn-r);color:var(--muted);font-size:13.5px;transition:.2s;white-space:nowrap}
.tabs button.on{background:var(--acc);color:var(--ink);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .8s var(--ease)}
.ring{--p:72;--c:var(--acc);width:var(--s,96px);height:var(--s,96px);border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg2)}
.ring b{position:relative;font-family:var(--mono);font-size:18px}
table.tb{width:100%;border-collapse:collapse}.tb th{font-size:12px;color:var(--faint);text-align:start;padding:12px 14px;border-bottom:1px solid var(--line)}.tb td{padding:14px;border-bottom:1px solid var(--line);font-size:14px}
.stat .v{font-family:var(--mono);font-size:32px;font-weight:700;direction:ltr;text-align:start;line-height:1.2}.stat .l{font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(53,229,155,.15)}

/* ---------- app shell ---------- */
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700}
.brand svg{width:34px;height:34px;filter:drop-shadow(0 0 10px var(--glow))}
.brand span{font-size:14.5px;line-height:1.1}.brand small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.28em;font-family:var(--mono)}
.side{position:fixed;top:52px;bottom:0;inset-inline-start:0;width:var(--side);z-index:80;padding:20px 16px;display:flex;flex-direction:column;background:var(--bg2);border-inline-end:1px solid var(--line);transition:transform .35s var(--ease)}
.nav{flex:1;overflow-y:auto;scrollbar-width:none}
.ng{font-size:11px;color:var(--faint);padding:16px 12px 6px;letter-spacing:.06em;font-weight:600}
.na{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--muted);font-size:14px;transition:.2s}
.na:hover{color:var(--text);background:var(--surface)}
.na.on{color:var(--ink);background:var(--acc);font-weight:700}
.na.on svg{color:var(--ink)}
.na .badge{margin-inline-start:auto}
.cc{padding:15px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);margin-top:12px}
.main{margin-inline-start:var(--side);min-height:calc(100vh - 52px)}
.top{position:sticky;top:52px;z-index:70;height:68px;display:flex;align-items:center;gap:14px;padding:0 28px;background:rgba(5,6,10,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.sp-pill{flex:1;max-width:440px;height:40px;border-radius:var(--btn-r);border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--muted);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--btn-r);border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-family:var(--mono);direction:ltr}
.pill.ember{color:var(--ember);border-color:rgba(255,181,71,.3)}
.view{padding:32px 28px 110px;max-width:1320px;margin-inline:auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.ph h1{font-size:clamp(24px,3vw,36px)}.ph p{color:var(--muted);margin-top:4px}
.tabbar,.menu-btn{display:none}

/* ---------- public nav / landing ---------- */
.pnav{position:sticky;top:64px;z-index:85;display:flex;justify-content:center;padding:0 16px}
.pnav .in{width:min(1140px,100%);height:60px;border-radius:var(--btn-r);display:flex;align-items:center;gap:16px;padding:0 18px;background:rgba(10,12,19,.85);backdrop-filter:blur(18px);border:1px solid var(--line2)}
.pnav .links{display:flex;gap:4px;margin-inline:auto}.pnav .links a{padding:8px 14px;border-radius:var(--btn-r);font-size:14px;color:var(--muted)}.pnav .links a:hover{color:var(--text);background:var(--surface)}
.hero{text-align:center;padding:70px 0 60px}
.hero h1{max-width:940px;margin:18px auto 0}
.hero .sub{max-width:640px;margin:20px auto 0;color:var(--muted);font-size:18px}
.hero .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.win{margin:54px auto 0;width:min(1040px,100%);border-radius:var(--rl);border:1px solid var(--line2);background:var(--bg2);box-shadow:0 40px 90px -30px rgba(0,0,0,.85);overflow:hidden;text-align:start}
.win .bar2{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--solid)}
.win .bar2 i{width:11px;height:11px;border-radius:50%;background:#2b3242}
.win .bar2 .url{margin-inline:auto;font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr}
.wb{display:grid;grid-template-columns:230px 1fr;min-height:380px}
.ws{border-inline-end:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px}
.ws .st{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;color:var(--muted);font-size:13.5px;cursor:pointer;border:1px solid transparent}
.ws .st.on{background:var(--accsoft);color:var(--acc);border-color:var(--acc);font-weight:600}
.wm{padding:26px}
.sec{padding:90px 0 0}.sec-h{max-width:700px;margin-bottom:42px}.sec-h.c{margin-inline:auto;text-align:center}.sec-h p{color:var(--muted);margin-top:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step .n{font-family:var(--mono);font-size:48px;font-weight:700;color:var(--acc);opacity:.35;line-height:1;margin-bottom:14px}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.bento .s2{grid-column:span 2}.bento .s3{grid-column:span 3}.bento .s4{grid-column:span 4}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch}
.plan{display:flex;flex-direction:column}.plan.pop{border-color:var(--acc);box-shadow:0 0 40px -15px var(--glow)}
.price{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;direction:ltr;text-align:start}
.feat{list-style:none;display:flex;flex-direction:column;gap:10px;margin:20px 0 24px;flex:1;font-size:14px}.feat li{display:flex;gap:9px;color:var(--muted)}.feat svg{color:var(--ok);margin-top:3px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;width:100%;transition:.2s}
.opt:hover{border-color:var(--acc)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line2);font-family:var(--mono);font-size:12.5px}
.opt.right{border-color:var(--ok);background:rgba(53,229,155,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,108,.12)}
.fc{perspective:1200px;height:300px;cursor:pointer;max-width:620px;margin-inline:auto}
.fc .in{position:relative;width:100%;height:100%;transition:transform .6s var(--ease);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:var(--bg2)}
.fc .b{transform:rotateY(180deg);border-color:var(--acc)}

#toasts{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);z-index:9800;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--solid);border:1px solid var(--acc);box-shadow:0 16px 40px rgba(0,0,0,.7);font-size:14px}

@media(max-width:1000px){
  .side{transform:translateX(100%)}.side.open{transform:none!important}
  .main{margin-inline-start:0}.view{padding:22px 16px 110px}.menu-btn{display:inline-grid}
  .tabbar{display:flex;position:fixed;bottom:12px;inset-inline:12px;z-index:90;height:62px;border-radius:20px;background:var(--solid);border:1px solid var(--line2);justify-content:space-around;align-items:center}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}.tabbar a.on{color:var(--acc);font-weight:700}
  .wb,.steps,.plans,.bento,.g4,.g3,.g2{grid-template-columns:1fr}.bento>.card{grid-column:auto!important}.pnav .links{display:none}
}

          <a href="#/" class="btn ghost blk">العودة للرئيسية</a>
        </div>
      </div>
    </div>
  `,

  signup:()=>R.login(),

  dashboard:()=>shell('dashboard',`
    ${`<div class="ph"><div><h1>أهلاً يا ${S.name.split(' ')[0]} 👋</h1><p>ملخص يومك الدراسي وخطة المراجعة الذكية.</p></div><div class="row"><a href="#/studio" class="btn pri">${I('plus','sm')} ملخص جديد</a></div></div>`}
    <div class="card glow" style="margin-bottom:20px">
      <div class="row between wrap">
        <div class="row"><div class="ibox ember">${I('gift')}</div><div><h3>مكافأة الستريك اليومية جاهزة!</h3><p class="muted">استمر 7 أيام متتالية واحصل على +10 كريدت هدية.</p></div></div>
        <button class="btn emb" onclick="S.credits+=5;toast('تم إضافة +5 كريدت لرصيدك!');render()">استلم +5 كريدت</button>
      </div>
    </div>
    <div class="g4">
      <div class="card stat hv"><div class="row between"><span class="ibox ember">${I('flame')}</span><span class="badge ok">نشط</span></div><div class="v mt2">${S.streak}</div><div class="l">أيام الستريك</div></div>
      <div class="card stat hv"><div class="row between"><span class="ibox">${I('star')}</span><span class="badge acc">Lv.7</span></div><div class="v mt2">${S.xp}</div><div class="l">نقاط الخبرة XP</div></div>
      <div class="card stat hv"><div class="row between"><span class="ibox ember">${I('coin')}</span><a href="#/wallet" class="badge warn">شحن</a></div><div class="v mt2">${S.credits}</div><div class="l">الرصيد المتاح</div></div>
      <div class="card stat hv"><div class="row between"><span class="ibox ok">${I('target')}</span><span class="badge ok">+6%</span></div><div class="v mt2">91%</div><div class="l">دقة الإجابات</div></div>
    </div>
    <div class="g2 mt3">
      <div class="card">
        <div class="row between"><h3>كورساتك النشطة</h3><a href="#/courses" class="acc" style="font-size:13.5px">عرض الكل ←</a></div>
        <div class="col mt2">${COURSES.slice(0,3).map(c=>`
          <a href="#/courses" class="card tight hv row">
            <div class="ibox" style="background:${c.g};color:#fff;border:0">${I(c.ic)}</div>
            <div class="grow"><div class="row between"><b>${c.t}</b><span class="mono muted">${c.p}%</span></div><div class="bar mt1"><i style="width:${c.p}%"></i></div></div>
          </a>`).join('')}
        </div>
      </div>
      <div class="card center">
        <div class="row between"><h3>مراجعة FSRS اليوم</h3><span class="badge warn">24 كارت مستحق</span></div>
        <div class="ring mt3" style="--p:74;--s:130px;margin-inline:auto"><b>74%</b></div>
        <p class="muted mt2">أنجزت 18 كارت من أصل 24 كارت اليوم</p>
        <a href="#/flashcards" class="btn pri blk mt2">ابدأ جلسة المراجعة الآن</a>
      </div>
    </div>
  `),

  courses:()=>shell('courses',`
    <div class="ph"><div><h1>المكتبة والكورسات</h1><p>اختر المادة لفتح المحاضرات والملخصات والكويزات.</p></div><a href="#/studio" class="btn pri">${I('plus','sm')} إضافة محاضرة</a></div>
    <div class="g3">${COURSES.map(c=>`
      <a href="#/summary" class="card hv col">
        <div style="height:110px;border-radius:14px;background:${c.g};display:grid;place-items:center;color:#fff">${I(c.ic,'xl')}</div>
        <div class="row between mt1"><h3>${c.t}</h3><span class="badge">${c.d}</span></div>
        <div class="muted mono" style="font-size:12.5px">${c.en}</div>
        <div class="bar mt1"><i style="width:${c.p}%"></i></div>
      </a>`).join('')}
    </div>
  `),

  studio:()=>shell('studio',`
    <div class="ph"><div><h1>استوديو التلخيص الذكي</h1><p>ارفع ملف PDF أو الصق نص المحاضرة لتوليد ملخص ثنائي اللغة وكويز فوري.</p></div></div>
    <div class="g2" style="grid-template-columns:1.5fr 1fr">
      <div class="card col">
        <div class="card tight center" style="border-style:dashed;padding:42px 20px;cursor:pointer" onclick="toast('تم اختيار ملف المحاضرة جاهز للتلخيص')">
          <div class="ibox" style="margin-inline:auto">${I('upload')}</div>
          <h3 class="mt2">اسحب ملف الـ PDF هنا أو اضغط للاختيار</h3>
          <p class="muted mt1">يدعم حتى 200 صفحة · استخراج الجداول والصور تلقائياً</p>
        </div>
        <div class="field mt2"><label>أو الصق عنوان/نص المحاضرة</label><textarea class="textarea" placeholder="مثال: Antihypertensive drugs — ACE inhibitors, ARBs, Calcium Channel Blockers..."></textarea></div>
        <div class="row wrap mt1">
          <span class="chip on">ثنائي اللغة (عربي + English)</span>
          <span class="chip on">+ كويز 10 أسئلة</span>
          <span class="chip on">+ فلاش كاردز FSRS</span>
        </div>
      </div>
      <div class="card col">
        <h3>ملخص التكلفة</h3>
        <div class="row between mt2"><span class="muted">تلخيص عميق + جداول</span><b class="mono">4 كريدت</b></div>
        <div class="row between"><span class="muted">بنك أسئلة وكويز</span><b class="mono">2 كريدت</b></div>
        <div class="row between"><span class="muted">تحقق مزدوج Verifier</span><span class="badge ok">مجاني</span></div>
        <div class="sep"></div>
        <div class="row between"><b>الإجمالي</b><b class="mono ember" style="font-size:24px">6 كريدت</b></div>
        <a href="#/summary" class="btn pri lg blk mt2" onclick="S.credits=Math.max(0,S.credits-6);toast('تم توليد الملخص بنجاح!')">ولّد الملخص الآن ${I('spark','sm')}</a>
      </div>
    </div>
  `),

  summary:()=>shell('summary',`
    <div class="ph"><div><span class="badge acc">Pharmacology · Lecture 12</span><h1 class="mt1">Antihypertensive Drugs — أدوية الضغط</h1></div><div class="row"><a href="#/quiz" class="btn pri">اختبر نفسك في المحاضرة</a></div></div>
    <div class="card col" style="line-height:2">
      <h3>1. مثبطات الإنزيم المحول للأنجيوتنسين (ACE Inhibitors)</h3>
      <p class="muted">تشمل <b>Captopril, Enalapril, Lisinopril</b>. تمنع تحويل Angiotensin I إلى Angiotensin II وتمنع تكسير Bradykinin.</p>
      <table class="tb mt2">
        <thead><tr><th>المجموعة</th><th>المثال</th><th>الأثر الجانبي الأهم في الامتحان</th></tr></thead>
        <tbody>
          <tr><td><b>ACE Inhibitors</b></td><td class="mono">Enalapril</td><td>Dry Cough (سعال جاف) + Angioedema + Hyperkalemia</td></tr>
          <tr><td><b>ARBs</b></td><td class="mono">Losartan</td><td>لا يسبب سعال جاف · يمنع في الحمل</td></tr>
          <tr><td><b>CCBs</b></td><td class="mono">Amlodipine</td><td>Peripheral Edema (تورم القدمين)</td></tr>
        </tbody>
      </table>
    </div>
  `),

  quiz:()=>shell('quiz',(()=>{const q=QUIZ[S.qIdx%QUIZ.length];return`
    <div class="ph"><div><h1>الكويز التفاعلي</h1><p>سؤال ${S.qIdx+1} من ${QUIZ.length} · الفارماكولوجي</p></div><span class="badge acc">+25 XP لكل إجابة</span></div>
    <div class="card" style="max-width:780px;margin-inline:auto">
      <h3>${q.q}</h3>
      <div class="col mt3">
        ${q.o.map((o,i)=>`<button class="opt" onclick="this.classList.add('${i===q.a?'right':'wrong'}');if(${i===q.a}){S.xp+=25;toast('إجابة صحيحة! +25 XP')}">${`<span class="k">${'ABCD'[i]}</span><span>${o}</span>`}</button>`).join('')}
      </div>
      <div class="card tight mt3" style="background:var(--accsoft)"><b class="acc">الشرح الطبي:</b> <span class="muted">${q.e}</span></div>
      <div class="row between mt3">
        <button class="btn" onclick="S.qIdx=(S.qIdx+QUIZ.length-1)%QUIZ.length;render()">السؤال السابق</button>
        <button class="btn pri" onclick="S.qIdx=(S.qIdx+1)%QUIZ.length;render()">السؤال التالي ←</button>
      </div>
    </div>
  `})()),

  flashcards:()=>shell('flashcards',(()=>{const c=CARDS[S.fcIdx%CARDS.length];return`
    <div class="ph"><div><h1>فلاش كاردز FSRS v4.5</h1><p>اضغط على الكارت لقلبه وتقييم تذكرك.</p></div></div>
    <div class="fc" onclick="this.classList.toggle('flip')">
      <div class="in">
        <div class="f"><span class="badge acc">المصطلح الطبي (اضغط للقلب)</span><h2>${c[0]}</h2></div>
        <div class="b"><span class="badge ok">الإجابة والشرح</span><h3>${c[1]}</h3></div>
      </div>
    </div>
    <div class="row mt3" style="justify-content:center">
      <button class="btn dng" onclick="S.fcIdx++;render()">نسيت (1 د)</button>
      <button class="btn" onclick="S.fcIdx++;render()">صعب (1 يوم)</button>
      <button class="btn pri" onclick="S.fcIdx++;S.xp+=15;toast('+15 XP');render()">جيد (4 أيام)</button>
      <button class="btn emb" onclick="S.fcIdx++;S.xp+=25;toast('+25 XP');render()">سهل جداً (10 أيام)</button>
    </div>
  `})()),

  youtube:()=>shell('youtube',`
    <div class="ph"><div><h1>تلخيص محاضرات يوتيوب</h1><p>حط لينك أي فيديو شرح وهنطلعلك الفصول والملخص والكويز.</p></div></div>
    <div class="card col"><div class="row"><input class="input" placeholder="https://www.youtube.com/watch?v=..." dir="ltr"><button class="btn pri" onclick="location.hash='#/summary';toast('تم استخراج ملخص الفيديو')">لخّص الفيديو</button></div></div>
  `),

  assistant:()=>shell('assistant',`
    <div class="ph"><div><h1>المساعد الطبي الذكي</h1><p>اسأل أي سؤال في محاضراتك وهيجاوبك بالمصادر.</p></div></div>
    <div class="card col">
      <div class="card tight"><b>أنت:</b> ما الفرق بين Enalapril و Losartan من حيث السعال الجاف؟</div>
      <div class="card tight" style="border-color:var(--acc)"><b class="acc">المساعد الذكي:</b> Enalapril يثبط إنزيم ACE فيرفع مستوى Bradykinin في الرئة مسبباً سعالاً جافاً، بينما Losartan يقفل مستقبل AT1 مباشرة دون المساس بالـ Bradykinin.</div>
      <div class="row mt2"><input class="input" placeholder="اكتب سؤالك الطبي هنا…"><button class="btn pri" onclick="toast('تم إرسال سؤالك')">إرسال</button></div>
    </div>
  `),

  leaderboard:()=>shell('leaderboard',`
    <div class="ph"><div><h1>لوحة المتصدرين</h1><p>أبطال الساحة هذا الأسبوع حسب نقاط الخبرة XP.</p></div></div>
    <div class="card col">
      ${[['إبراهيم قنديل (أنت)',S.xp+9800,'#1'],['أحمد الشرقاوي',12400,'#2'],['سارة عادل',11950,'#3'],['يوسف خالد',10200,'#4']].map(([n,x,r],i)=>`
        <div class="card tight row between" style="${i===0?'border-color:var(--acc)':''}">
          <div class="row"><b class="mono acc" style="width:36px">${r}</b><div class="avatar sm">${n[0]}</div><b>${n}</b></div>
          <span class="badge ember mono">${x} XP</span>
        </div>`).join('')}
    </div>
  `),

  wallet:()=>shell('wallet',`
    <div class="ph"><div><h1>الرصيد والباقات</h1><p>رصيدك الحالي: <b class="acc mono">${S.credits} كريدت</b></p></div></div>
    ${plansHTML()}
  `),

  profile:()=>shell('profile',`
    <div class="ph"><div><h1>الملف الشخصي</h1><p>إدارة بياناتك واختيار شكل الواجهة المفضل.</p></div></div>
    <div class="card row"><div class="avatar xl">إ</div><div><h2>${S.name}</h2><p class="muted">الباقة الحالية: ${S.plan} · المستوى ${Math.floor(S.xp/500)+1}</p></div></div>
  `),

  admin:()=>shell('admin',`
    <div class="ph"><div><h1>لوحة الإدارة</h1><p>إحصائيات المنصة والطلاب والعمليات.</p></div></div>
    <div class="g4">
      <div class="card stat"><div class="v">1,420</div><div class="l">طالب نشط</div></div>
      <div class="card stat"><div class="v">18,940</div><div class="l">ملخص متولد</div></div>
      <div class="card stat"><div class="v">99.2%</div><div class="l">نسبة نجاح الـ AI</div></div>
      <div class="card stat"><div class="v">192</div><div class="l">باقات جاهزة</div></div>
    </div>
  `)
};

function render(){
  const h=(location.hash||'#/').replace(/^#\/?/,'').split('/')[0]||'landing';
  $('#app').innerHTML=(R[h]||R.landing)();
}
addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-set-skin]');
  if(b){
    const sk=b.dataset.setSkin;
    document.documentElement.setAttribute('data-skin',sk);
    $$('[data-set-skin]').forEach(x=>x.classList.toggle('on',x===b));
    toast('تم تفعيل الشكل: '+b.textContent.trim());
  }
});
render();
</script>
</body>
</html>
